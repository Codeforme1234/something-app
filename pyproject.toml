[tool.poetry]
name = "quizdeck-api"
version = "0.1.0"
description = "QuizDeck backend - AI-powered MCQ test platform"
authors = ["Devesh Tiwari <deveshkumar.tiwari@mindtickle.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
boto3 = "^1.35.0"
PyJWT = { extras = ["crypto"], version = "^2.9.0" }
jinja2 = "^3.1.0"
openai = "^1.55.0"
python-ulid = "^3.0.0"
email-validator = "^2.2.0"
bleach = "^6.1.0"
# Imported directly by app/auth/cognito.py (PyJWKClient ssl_context) --
# declared even though httpx/openai already pull it in transitively.
certifi = "*"
# Required by FastAPI to parse multipart/form-data (UploadFile) on the
# question-image upload route.
python-multipart = "^0.0.9"
# PDF question extraction (app/pdf/). pdfplumber is MIT and gives text plus
# where images sit on a page; pypdfium2 is BSD-3/Apache and rasterizes.
# PyMuPDF is deliberately NOT used despite docs/PLAN.md naming it: it is
# AGPL-3.0 or paid, and AGPL s13's network-interaction clause is triggered by
# exactly what a SaaS backend does.
pdfplumber = "^0.11.0"
pypdfium2 = "^4.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
# Intercepts boto3 in-process, so the suite exercises the real DynamoDB and S3
# code paths without an emulator, a container, or an AWS account. Replaced
# DynamoDB Local and MinIO -- see tests/conftest.py.
moto = {extras = ["dynamodb", "s3"], version = "^5.0"}

[tool.pytest.ini_options]
# Domain classes are named Test/TestStatus/TestSummary/TestDetail per the
# spec; the suite has no test *classes* (only test_* functions), so silence
# pytest's harmless "cannot collect" warning about them instead of renaming.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
