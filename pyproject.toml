[tool.poetry]
name = "quizdeck-api"
version = "0.1.0"
description = "QuizDeck backend - AI-powered MCQ test platform"
authors = ["Devesh Tiwari <deveshkumar.tiwari@mindtickle.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
boto3 = "^1.35.0"
PyJWT = { extras = ["crypto"], version = "^2.9.0" }
jinja2 = "^3.1.0"
openai = "^1.55.0"
python-ulid = "^3.0.0"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
