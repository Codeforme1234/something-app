services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: quizdeck-dynamodb
    # Runs as root so the mounted volume is writable; the image's default
    # `dynamodblocal` user cannot create the sqlite file inside a named volume.
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8001:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: quizdeck-dynamodb-admin
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8002:8001"
    depends_on:
      - dynamodb-local

volumes:
  dynamodb-data:
